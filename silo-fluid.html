<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Fluid | Silo</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Space Grotesk', sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .nav {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 100;
        }

        a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            color: #fff;
        }

        .hud {
            position: absolute;
            bottom: 3rem;
            left: 3rem;
            color: #fff;
            pointer-events: none;
            mix-blend-mode: difference;
        }

        h1 {
            font-size: 4rem;
            line-height: 1;
            margin: 0;
            letter-spacing: -0.05em;
            font-weight: 700;
        }

        p {
            font-size: 1rem;
            opacity: 0.7;
            margin: 0;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 1.5rem;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 5px;
            animation: fadeOut 2s 3s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="nav"><a href="silo.html">← SILO</a></div>
    <div class="hint">Click & Drag</div>

    <div class="hud">
        <p>Experiment 09</p>
        <h1>FLUID</h1>
        <div style="margin-top:10px; color:#0f0;">NAVIER-STOKES SOLVER</div>
    </div>

    <canvas id="glcanvas"></canvas>

    <script>
        // WEBGL FLUID SIMULATION
        // Based on Jos Stam's Stable Fluids

        const canvas = document.getElementById('glcanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const gl = canvas.getContext('webgl');

        // Config
        const SIM_RES = 128; // Grid size
        const DYE_RES = 512; // Visualization Size
        const ITERATIONS = 10;

        if (!gl.getExtension('OES_texture_float')) alert('No float texture support');

        // --- SHADERS ---

        const baseVertexShader = `
            attribute vec2 aPosition;
            varying vec2 vUv;
            void main() {
                vUv = aPosition * 0.5 + 0.5;
                gl_Position = vec4(aPosition, 0.0, 1.0);
            }
        `;

        const clearShader = `
            precision highp float;
            varying vec2 vUv;
            uniform float value;
            void main(){ gl_FragColor = vec4(value, 0, 0, 0); }
        `;

        const advectShader = `
            precision highp float;
            varying vec2 vUv;
            uniform sampler2D uVelocity;
            uniform sampler2D uSource;
            uniform vec2 texelSize;
            uniform float dt;
            uniform float dissipation;
            void main() {
                vec2 coord = vUv - texture2D(uVelocity, vUv).xy * texelSize * dt;
                gl_FragColor = texture2D(uSource, coord) * dissipation;
            }
        `;

        const divergenceShader = `
            precision highp float;
            varying vec2 vUv;
            uniform sampler2D uVelocity;
            uniform vec2 texelSize;
            void main() {
                float L = texture2D(uVelocity, vUv - vec2(texelSize.x, 0.0)).x;
                float R = texture2D(uVelocity, vUv + vec2(texelSize.x, 0.0)).x;
                float T = texture2D(uVelocity, vUv + vec2(0.0, texelSize.y)).y;
                float B = texture2D(uVelocity, vUv - vec2(0.0, texelSize.y)).y;
                
                vec2 C = texture2D(uVelocity, vUv).xy;
                if(vUv.x < 0.0) L = -C.x;
                if(vUv.x > 1.0) R = -C.x;
                if(vUv.y > 1.0) T = -C.y;
                if(vUv.y < 0.0) B = -C.y;
                
                float div = 0.5 * (R - L + T - B);
                gl_FragColor = vec4(div, 0, 0, 1);
            }
        `;

        const pressureShader = `
            precision highp float;
            varying vec2 vUv;
            uniform sampler2D uPressure;
            uniform sampler2D uDivergence;
            uniform vec2 texelSize;
            void main() {
                float L = texture2D(uPressure, vUv - vec2(texelSize.x, 0.0)).x;
                float R = texture2D(uPressure, vUv + vec2(texelSize.x, 0.0)).x;
                float T = texture2D(uPressure, vUv + vec2(0.0, texelSize.y)).x;
                float B = texture2D(uPressure, vUv - vec2(0.0, texelSize.y)).x;
                float C = texture2D(uPressure, vUv).x;
                float divergence = texture2D(uDivergence, vUv).x;
                float pressure = (L + R + B + T - divergence) * 0.25;
                gl_FragColor = vec4(pressure, 0, 0, 1);
            }
        `;

        const gradientSubtractShader = `
            precision highp float;
            varying vec2 vUv;
            uniform sampler2D uPressure;
            uniform sampler2D uVelocity;
            uniform vec2 texelSize;
            void main() {
                float L = texture2D(uPressure, vUv - vec2(texelSize.x, 0.0)).x;
                float R = texture2D(uPressure, vUv + vec2(texelSize.x, 0.0)).x;
                float T = texture2D(uPressure, vUv + vec2(0.0, texelSize.y)).x;
                float B = texture2D(uPressure, vUv - vec2(0.0, texelSize.y)).x;
                vec2 velocity = texture2D(uVelocity, vUv).xy;
                velocity.xy -= vec2(R - L, T - B);
                gl_FragColor = vec4(velocity, 0, 1);
            }
        `;

        const splatShader = `
            precision highp float;
            varying vec2 vUv;
            uniform sampler2D uTarget;
            uniform float aspectRatio;
            uniform vec3 color;
            uniform vec2 point;
            uniform float radius;
            void main() {
                vec2 p = vUv - point.xy;
                p.x *= aspectRatio;
                vec3 splat = exp(-dot(p, p) / radius) * color;
                vec3 base = texture2D(uTarget, vUv).xyz;
                gl_FragColor = vec4(base + splat, 1.0);
            }
        `;

        const displayShader = `
            precision highp float;
            varying vec2 vUv;
            uniform sampler2D uTexture;
            void main() {
                // Color mapping
                vec3 c = texture2D(uTexture, vUv).rgb;
                // Fancy coloring based on density
                // Simple: Density is R channel from Dye
                
                // Let's make it neon
                float d = length(c);
                vec3 color = vec3(c.r, c.g*0.5, c.b*0.8) + vec3(0, d*0.2, d*0.5);
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // --- GL HELPERS ---

        function createProgram(vSource, fSource) {
            const vs = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vs, vSource); gl.compileShader(vs);
            const fs = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fs, fSource); gl.compileShader(fs);
            const p = gl.createProgram();
            gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
            return p;
        }

        function createFBO(w, h, type = gl.FLOAT) {
            const texture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, type, null);

            const fbo = gl.createFramebuffer();
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
            return { fbo, texture, width: w, height: h };
        }

        function createDoubleFBO(w, h, type = gl.FLOAT) {
            return {
                read: createFBO(w, h, type),
                write: createFBO(w, h, type),
                swap: function () {
                    const temp = this.read; this.read = this.write; this.write = temp;
                }
            }
        }

        // --- INIT ---

        const programs = {
            advect: createProgram(baseVertexShader, advectShader),
            divergence: createProgram(baseVertexShader, divergenceShader),
            pressure: createProgram(baseVertexShader, pressureShader),
            gradSub: createProgram(baseVertexShader, gradientSubtractShader),
            splat: createProgram(baseVertexShader, splatShader),
            display: createProgram(baseVertexShader, displayShader)
        };

        // Quad
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);

        // Buffers
        let density = createDoubleFBO(DYE_RES, DYE_RES);
        let velocity = createDoubleFBO(SIM_RES, SIM_RES);
        let divergence = createFBO(SIM_RES, SIM_RES);
        let pressure = createDoubleFBO(SIM_RES, SIM_RES);

        function blit(dest) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, dest ? dest.fbo : null);
            gl.viewport(0, 0, dest ? dest.width : canvas.width, dest ? dest.height : canvas.height);

            // Attrib
            const loc = gl.getAttribLocation(programs.advect, 'aPosition'); // Any program works
            gl.enableVertexAttribArray(loc);
            gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
            gl.drawArrays(gl.TRIANGLE_FAN, 0, 4);
        }

        let lastTime = Date.now();

        function update() {
            const dt = Math.min((Date.now() - lastTime) / 1000, 0.016);
            lastTime = Date.now();

            // 1. Splat (User Input)
            if (pointers.length > 0) {
                gl.useProgram(programs.splat);
                const uTarget = gl.getUniformLocation(programs.splat, 'uTarget');
                const uRatio = gl.getUniformLocation(programs.splat, 'aspectRatio');
                const uPoint = gl.getUniformLocation(programs.splat, 'point');
                const uColor = gl.getUniformLocation(programs.splat, 'color');
                const uRadius = gl.getUniformLocation(programs.splat, 'radius');

                gl.uniform1f(uRatio, canvas.width / canvas.height);

                for (let p of pointers) {
                    if (p.moved) {
                        // Velocity Splat
                        gl.uniform1i(uTarget, 0);
                        gl.activeTexture(gl.TEXTURE0);
                        gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
                        gl.uniform2f(uPoint, p.x, p.y);
                        gl.uniform3f(uColor, p.dx * 10, p.dy * 10, 0.0); // Force
                        gl.uniform1f(uRadius, 0.005);
                        blit(velocity.write);
                        velocity.swap();

                        // Density Splat
                        gl.uniform1i(uTarget, 0);
                        gl.bindTexture(gl.TEXTURE_2D, density.read.texture);
                        gl.uniform3f(uColor, 0.8, 0.8, 0.8); // White Smoke
                        gl.uniform1f(uRadius, 0.003);
                        blit(density.write);
                        density.swap();

                        p.moved = false;
                    }
                }
            }

            // 2. Advect Velocity
            gl.useProgram(programs.advect);
            gl.uniform1i(gl.getUniformLocation(programs.advect, 'uVelocity'), 0);
            gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
            gl.uniform1i(gl.getUniformLocation(programs.advect, 'uSource'), 0); // Self-advect
            gl.uniform2f(gl.getUniformLocation(programs.advect, 'texelSize'), 1 / SIM_RES, 1 / SIM_RES);
            gl.uniform1f(gl.getUniformLocation(programs.advect, 'dt'), dt);
            gl.uniform1f(gl.getUniformLocation(programs.advect, 'dissipation'), 0.98);
            blit(velocity.write);
            velocity.swap();

            // 3. Advect Density
            gl.useProgram(programs.advect);
            gl.uniform1i(gl.getUniformLocation(programs.advect, 'uVelocity'), 0);
            gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
            gl.uniform1i(gl.getUniformLocation(programs.advect, 'uSource'), 1);
            gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, density.read.texture);
            gl.uniform2f(gl.getUniformLocation(programs.advect, 'texelSize'), 1 / DYE_RES, 1 / DYE_RES);
            gl.uniform1f(gl.getUniformLocation(programs.advect, 'dissipation'), 0.97);
            blit(density.write);
            density.swap();

            // 4. Divergence
            gl.useProgram(programs.divergence);
            gl.uniform1i(gl.getUniformLocation(programs.divergence, 'uVelocity'), 0);
            gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
            gl.uniform2f(gl.getUniformLocation(programs.divergence, 'texelSize'), 1 / SIM_RES, 1 / SIM_RES);
            blit(divergence);

            // 5. Pressure (Jacobi)
            gl.useProgram(programs.pressure);
            gl.uniform1i(gl.getUniformLocation(programs.pressure, 'uDivergence'), 0);
            gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, divergence.texture);
            gl.uniform2f(gl.getUniformLocation(programs.pressure, 'texelSize'), 1 / SIM_RES, 1 / SIM_RES);

            // Clear pressure
            // Actually we reuse pressure result as guess

            for (let i = 0; i < ITERATIONS; i++) {
                gl.uniform1i(gl.getUniformLocation(programs.pressure, 'uPressure'), 1);
                gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, pressure.read.texture);
                blit(pressure.write);
                pressure.swap();
            }

            // 6. Gradient Subtract (Project)
            gl.useProgram(programs.gradSub);
            gl.uniform1i(gl.getUniformLocation(programs.gradSub, 'uPressure'), 0);
            gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, pressure.read.texture);
            gl.uniform1i(gl.getUniformLocation(programs.gradSub, 'uVelocity'), 1);
            gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
            gl.uniform2f(gl.getUniformLocation(programs.gradSub, 'texelSize'), 1 / SIM_RES, 1 / SIM_RES);
            blit(velocity.write);
            velocity.swap();

            // 7. Display
            gl.useProgram(programs.display);
            gl.uniform1i(gl.getUniformLocation(programs.display, 'uTexture'), 0);
            gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, density.read.texture);
            blit(null);

            requestAnimationFrame(update);
        }

        // --- INPUT ---
        let pointers = [];
        window.addEventListener('mousedown', e => {
            pointers.push({
                x: e.clientX / canvas.width, y: 1.0 - e.clientY / canvas.height,
                dx: 0, dy: 0, moved: false, id: -1
            });
        });
        window.addEventListener('mousemove', e => {
            if (pointers.length > 0) {
                const p = pointers[0]; // Simple single touch
                let nx = e.clientX / canvas.width;
                let ny = 1.0 - e.clientY / canvas.height;
                p.dx = nx - p.x;
                p.dy = ny - p.y;
                p.x = nx; p.y = ny;
                p.moved = true;
            }
        });
        window.addEventListener('mouseup', () => pointers = []);

        update();

    </script>
</body>

</html>
