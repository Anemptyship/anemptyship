<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Reaction | Silo</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Space Grotesk', sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
        }

        .nav {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 100;
        }

        a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            color: #fff;
        }

        .hud {
            position: absolute;
            bottom: 3rem;
            left: 3rem;
            color: #fff;
            pointer-events: none;
            mix-blend-mode: difference;
        }

        h1 {
            font-size: 3rem;
            line-height: 1;
            margin: 0;
            letter-spacing: -0.05em;
            font-weight: 700;
        }

        p {
            font-size: 0.8rem;
            opacity: 0.7;
            margin: 0;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="nav"><a href="silo.html">← SILO</a></div>
    <div class="hud">
        <p>Experiment 15</p>
        <h1>REACTION</h1>
        <div style="margin-top:10px; color:#f0f;">GRAY-SCOTT DIFFUSION</div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const gl = canvas.getContext('webgl');

        // Gray-Scott Params
        // Feed/Kill rates
        let feed = 0.055;
        let kill = 0.062;

        const vs = `
            attribute vec2 position;
            varying vec2 vUv;
            void main() {
                vUv = position * 0.5 + 0.5;
                gl_Position = vec4(position, 0, 1);
            }
        `;

        const fsSim = `
            precision highp float;
            uniform sampler2D uvState;
            uniform vec2 scale;
            uniform float feed;
            uniform float kill;
            varying vec2 vUv;
            
            void main() {
                vec4 c = texture2D(uvState, vUv);
                float a = c.r;
                float b = c.g;
                
                // Laplacian
                float la = 0.0;
                float lb = 0.0;
                
                la += texture2D(uvState, vUv + vec2(-scale.x, 0.0)).r * 0.2;
                la += texture2D(uvState, vUv + vec2( scale.x, 0.0)).r * 0.2;
                la += texture2D(uvState, vUv + vec2(0.0, -scale.y)).r * 0.2;
                la += texture2D(uvState, vUv + vec2(0.0,  scale.y)).r * 0.2;
                la += texture2D(uvState, vUv + vec2(-scale.x, -scale.y)).r * 0.05;
                la += texture2D(uvState, vUv + vec2( scale.x, -scale.y)).r * 0.05;
                la += texture2D(uvState, vUv + vec2(-scale.x,  scale.y)).r * 0.05;
                la += texture2D(uvState, vUv + vec2( scale.x,  scale.y)).r * 0.05;
                la += a * -1.0;
                
                lb += texture2D(uvState, vUv + vec2(-scale.x, 0.0)).g * 0.2;
                lb += texture2D(uvState, vUv + vec2( scale.x, 0.0)).g * 0.2;
                lb += texture2D(uvState, vUv + vec2(0.0, -scale.y)).g * 0.2;
                lb += texture2D(uvState, vUv + vec2(0.0,  scale.y)).g * 0.2;
                lb += texture2D(uvState, vUv + vec2(-scale.x, -scale.y)).g * 0.05;
                lb += texture2D(uvState, vUv + vec2( scale.x, -scale.y)).g * 0.05;
                lb += texture2D(uvState, vUv + vec2(-scale.x,  scale.y)).g * 0.05;
                lb += texture2D(uvState, vUv + vec2( scale.x,  scale.y)).g * 0.05;
                lb += b * -1.0;
                
                // Reaction
                float aa = a + (1.0 * la - a*b*b + feed*(1.0-a));
                float bb = b + (0.5 * lb + a*b*b - (kill+feed)*b);
                
                gl_FragColor = vec4(clamp(aa,0.0,1.0), clamp(bb,0.0,1.0), 0, 1);
            }
        `;

        const fsDraw = `
            precision highp float;
            uniform sampler2D uvState;
            varying vec2 vUv;
            void main() {
                float b = texture2D(uvState, vUv).g;
                float a = texture2D(uvState, vUv).r;
                
                // Coloring
                vec3 col = vec3(0.0);
                if(b > 0.1) col = vec3(b*2.0, b*0.5, b*4.0);
                
                gl_FragColor = vec4(col, 1.0);
            }
        `;

        function createShader(gl, type, source) {
            const s = gl.createShader(type);
            gl.shaderSource(s, source); gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.log(gl.getShaderInfoLog(s));
            return s;
        }
        function createProgram(gl, vs, fs) {
            const p = gl.createProgram();
            gl.attachShader(p, createShader(gl, gl.VERTEX_SHADER, vs));
            gl.attachShader(p, createShader(gl, gl.FRAGMENT_SHADER, fs));
            gl.linkProgram(p);
            return p;
        }

        const progSim = createProgram(gl, vs, fsSim);
        const progDraw = createProgram(gl, vs, fsDraw);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

        const SIZE = 512;
        function createTex() {
            const t = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, t);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); // Linear for smoother diffusion
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

            // Initial Seed
            const data = new Float32Array(SIZE * SIZE * 4);
            for (let i = 0; i < SIZE * SIZE; i++) {
                data[i * 4] = 1.0; // A
                data[i * 4 + 1] = 0.0; // B
                // Square seed center
                let x = i % SIZE;
                let y = Math.floor(i / SIZE);
                if (Math.abs(x - SIZE / 2) < 20 && Math.abs(y - SIZE / 2) < 20) {
                    data[i * 4 + 1] = 1.0; // B
                }
            }
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SIZE, SIZE, 0, gl.RGBA, gl.FLOAT, data);
            return t;
        }

        if (!gl.getExtension('OES_texture_float')) alert("No Float Tex");

        let texA = createTex();
        let texB = createTex();
        let fb = gl.createFramebuffer();

        function loop() {
            gl.useProgram(progSim);
            gl.uniform2f(gl.getUniformLocation(progSim, 'scale'), 1 / SIZE, 1 / SIZE);
            gl.uniform1f(gl.getUniformLocation(progSim, 'feed'), feed);
            gl.uniform1f(gl.getUniformLocation(progSim, 'kill'), kill);

            // Multiple steps for speed
            for (let i = 0; i < 12; i++) {
                gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texB, 0);
                gl.bindTexture(gl.TEXTURE_2D, texA);

                const loc = gl.getAttribLocation(progSim, 'position');
                gl.enableVertexAttribArray(loc);
                gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

                gl.viewport(0, 0, SIZE, SIZE);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                let tmp = texA; texA = texB; texB = tmp;
            }

            // Draw
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.useProgram(progDraw);
            gl.bindTexture(gl.TEXTURE_2D, texA);
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            requestAnimationFrame(loop);
        }

        loop();

        // Interaction: Add chemical B
        // Need to write to texture... complicated without FBO blit. 
        // Reset on click easiest
        window.addEventListener('click', () => {
            // Change params slightly for variety
            feed = 0.03 + Math.random() * 0.04;
            kill = 0.05 + Math.random() * 0.02;
            texA = createTex();
        });

    </script>
</body>

</html>
