<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Life | Silo</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Space Grotesk', sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
        }

        .nav {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 100;
        }

        a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            color: #fff;
        }

        .hud {
            position: absolute;
            bottom: 3rem;
            left: 3rem;
            color: #fff;
            pointer-events: none;
            mix-blend-mode: difference;
        }

        h1 {
            font-size: 3rem;
            line-height: 1;
            margin: 0;
            letter-spacing: -0.05em;
            font-weight: 700;
        }

        p {
            font-size: 0.8rem;
            opacity: 0.7;
            margin: 0;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="nav"><a href="silo.html">← SILO</a></div>
    <div class="hud">
        <p>Experiment 13</p>
        <h1>LIFE</h1>
        <div style="margin-top:10px; color:#0f0;">CONWAYS GAME OF LIFE</div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const gl = canvas.getContext('webgl');

        // Textures
        const SIZE = 512; // Grid Size

        const vs = `
            attribute vec2 position;
            varying vec2 vUv;
            void main() {
                vUv = position * 0.5 + 0.5;
                gl_Position = vec4(position, 0, 1);
            }
        `;

        const fsStep = `
            precision mediump float;
            uniform sampler2D state;
            uniform vec2 scale;
            varying vec2 vUv;
            
            void main() {
                float current = texture2D(state, vUv).r;
                float neighbors = 0.0;
                
                for(int i=-1; i<=1; i++) {
                    for(int j=-1; j<=1; j++) {
                        if(i==0 && j==0) continue;
                        neighbors += texture2D(state, vUv + vec2(float(i)*scale.x, float(j)*scale.y)).r;
                    }
                }
                
                float next = 0.0;
                if(current > 0.5) {
                    if(neighbors > 1.9 && neighbors < 3.1) next = 1.0;
                } else {
                    if(neighbors > 2.9 && neighbors < 3.1) next = 1.0;
                }
                
                // Color mapping: R=State, G=Age/Trail?
                // Just simpler R for now
                gl_FragColor = vec4(next, 0, 0, 1);
            }
        `;

        const fsDraw = `
            precision mediump float;
            uniform sampler2D state;
            varying vec2 vUv;
            void main() {
                float s = texture2D(state, vUv).r;
                if(s > 0.5) {
                    gl_FragColor = vec4(0.0, 1.0, 0.5, 1.0); // Neon Green
                } else {
                    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
                }
            }
        `;

        function createShader(gl, type, source) {
            const s = gl.createShader(type);
            gl.shaderSource(s, source); gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.log(gl.getShaderInfoLog(s));
            return s;
        }
        function createProgram(gl, vs, fs) {
            const p = gl.createProgram();
            gl.attachShader(p, createShader(gl, gl.VERTEX_SHADER, vs));
            gl.attachShader(p, createShader(gl, gl.FRAGMENT_SHADER, fs));
            gl.linkProgram(p);
            return p;
        }

        const progStep = createProgram(gl, vs, fsStep);
        const progDraw = createProgram(gl, vs, fsDraw);

        // Quad
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

        // Double Buffer
        let texA = createExtTexture();
        let texB = createExtTexture();
        let fb = gl.createFramebuffer();

        function createExtTexture() {
            const t = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, t);
            // Noise
            const data = new Uint8Array(SIZE * SIZE * 4);
            for (let i = 0; i < SIZE * SIZE * 4; i += 4) {
                const r = Math.random() > 0.8 ? 255 : 0;
                data[i] = r; data[i + 1] = 0; data[i + 2] = 0; data[i + 3] = 255;
            }
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SIZE, SIZE, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
            return t;
        }

        let tick = 0;

        function draw() {
            // Step: A -> B
            gl.useProgram(progStep);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texB, 0);

            gl.bindTexture(gl.TEXTURE_2D, texA);
            const posLoc = gl.getAttribLocation(progStep, 'position');
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

            gl.uniform1i(gl.getUniformLocation(progStep, 'state'), 0);
            gl.uniform2f(gl.getUniformLocation(progStep, 'scale'), 1 / SIZE, 1 / SIZE);
            gl.viewport(0, 0, SIZE, SIZE);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            // Render B to Screen
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.useProgram(progDraw);
            gl.bindTexture(gl.TEXTURE_2D, texB);
            gl.viewport(0, 0, canvas.width, canvas.height);
            // Attrib pointer is already set
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            // Swap
            let tmp = texA; texA = texB; texB = tmp;

            requestAnimationFrame(draw);
        }

        draw();

        window.addEventListener('mousedown', () => {
            // Reset on click
            texA = createExtTexture();
        });

    </script>
</body>

</html>
