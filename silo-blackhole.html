<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Black Hole Gravitational Lensing | Silo</title>
    <style>
        body {
            margin: 0;
            background: #050505;
            color: #e0e0e0;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }

        .nav {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 100;
        }

        a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            color: #fff;
        }

        .hud {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            color: #fff;
            pointer-events: none;
            mix-blend-mode: difference;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            letter-spacing: -0.05em;
        }

        p {
            font-size: 0.8rem;
            opacity: 0.7;
            margin: 0;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .controls {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .controls label {
            font-size: 0.9rem;
        }

        .controls input {
            width: 200px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="nav"><a href="silo.html">← Silo</a></div>
    <div class="hud">
        <p>Experiment 19</p>
        <h1>BLACK HOLE LENSING</h1>
    </div>
    <div class="controls">
        <label for="mass">Mass (gravity strength): <span id="massVal">1.00</span></label>
        <input type="range" id="mass" min="0" max="200" value="100">
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext('webgl');
        const massSlider = document.getElementById('mass');
        const massVal = document.getElementById('massVal');
        let mass = 1.0;
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();
        massSlider.addEventListener('input', () => {
            mass = massSlider.value / 100; // 0‑2 range
            massVal.textContent = mass.toFixed(2);
        });
        // Vertex shader (pass through)
        const vsSource = `
            attribute vec2 aPos;
            varying vec2 vUV;
            void main(){
                vUV = aPos * 0.5 + 0.5;
                gl_Position = vec4(aPos,0.0,1.0);
            }
        `;
        // Fragment shader: simple Schwarzschild lensing approximation
        const fsSource = `
            precision highp float;
            varying vec2 vUV;
            uniform vec2 uResolution;
            uniform float uMass;
            const float G = 1.0; // scale factor
            const float c = 1.0; // speed of light (c=1 units)
            void main(){
                // Normalized screen coordinates centered at (0,0)
                vec2 p = (vUV - 0.5) * vec2(uResolution.x/uResolution.y,1.0);
                // Position of the black hole (center of screen)
                vec2 bh = vec2(0.0,0.0);
                // Vector from BH to pixel
                vec2 r = p - bh;
                float rLen = length(r);
                // Deflection angle approximation: alpha = 4GM/(c^2 r)
                float alpha = 4.0 * G * uMass / (c*c * max(rLen,0.001));
                // Rotate the ray back by alpha around the BH
                float theta = atan(r.y, r.x);
                theta -= alpha;
                vec2 src = bh + rLen * vec2(cos(theta), sin(theta));
                // Sample a star field texture (procedural)
                // Simple star field using noise
                float n = fract(sin(dot(src*12.9898, vec2(12.34,56.78))) * 43758.5453;
                float brightness = step(0.9995, n); // sparse stars
                vec3 col = vec3(brightness);
                // Black hole silhouette
                if(rLen < 0.02 * uMass) col = vec3(0.0);
                gl_FragColor = vec4(col,1.0);
            }
        `;
        // Compile shaders
        function compileShader(src, type) {
            const sh = gl.createShader(type);
            gl.shaderSource(sh, src);
            gl.compileShader(sh);
            if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
                console.error('Shader compile error', gl.getShaderInfoLog(sh));
            }
            return sh;
        }
        const vs = compileShader(vsSource, gl.VERTEX_SHADER);
        const fs = compileShader(fsSource, gl.FRAGMENT_SHADER);
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) console.error('Program link error', gl.getProgramInfoLog(program));
        gl.useProgram(program);
        // Fullscreen quad
        const quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(program, 'aPos');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
        const uRes = gl.getUniformLocation(program, 'uResolution');
        const uMass = gl.getUniformLocation(program, 'uMass');
        function render() {
            gl.clearColor(0.0, 0.0, 0.0, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.uniform2f(uRes, canvas.width, canvas.height);
            gl.uniform1f(uMass, mass);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }
        render();
    </script>
</body>

</html>
